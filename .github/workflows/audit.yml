name: Live audit
# Opens the deployed site at phone and desktop widths and lists what looks broken. Read-only.
# Logged-in passes use throwaway audit accounts (audit-<plan>@gnomon.invalid) with sessions that live for this
# run only; no real user is touched and no credits are spent. Nothing personal is printed (logs are public).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily report']
    types: [completed]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Audit accounts and sessions
        id: sessions
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm i --no-save wrangler@4 >/dev/null
          id=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write((l.find(x=>x.name==='gnm')||{}).uuid||'')")
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          node scripts/audit-sessions.mjs > /tmp/audit.sql 2>/tmp/audit.json
          npx wrangler d1 execute gnm --remote --file /tmp/audit.sql >/dev/null
          for t in $(node -e "for(const v of Object.values(JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8'))))console.log(v)"); do echo "::add-mask::$t"; done
          { echo 'json<<EOF'; cat /tmp/audit.json; echo; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - run: node scripts/live-audit.mjs
        env:
          AUDIT_SESSIONS: ${{ steps.sessions.outputs.json }}
      - name: End audit sessions
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute gnm --remote --command "DELETE FROM sessions WHERE user_id LIKE 'audit-%'" >/dev/null || true

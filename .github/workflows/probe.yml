# Temporary: checks which public endpoints work from GitHub runners. Removed before merge.
name: probe
on:
  push:
    branches: [claude/busy-ramanujan-yrcmb7]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Naver list endpoints
        run: |
          UA='Mozilla/5.0'
          for u in \
            'https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=3' \
            'https://m.stock.naver.com/api/stocks/marketValue/KOSDAQ?page=1&pageSize=3' \
            'https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=100' \
            'https://m.stock.naver.com/api/stocks/up/KOSPI?page=1&pageSize=3' \
            'https://m.stock.naver.com/api/stocks/quantTop/KOSPI?page=1&pageSize=3' \
            'https://m.stock.naver.com/api/stocks/priceTop/KOSPI?page=1&pageSize=3' \
            'https://ac.stock.naver.com/ac?q=%EC%82%BC%EC%84%B1&target=stock'; do
            echo "=== $u"
            curl -s -A "$UA" -o /tmp/r -w 'HTTP %{http_code} size %{size_download}\n' "$u"
            head -c 1500 /tmp/r; echo
          done
          echo "=== total counts"
          curl -s -A "$UA" 'https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=100' | python3 -c "import sys,json;d=json.load(sys.stdin);print({k:(v if not isinstance(v,list) else len(v)) for k,v in d.items()})"
          curl -s -A "$UA" 'https://m.stock.naver.com/api/stocks/marketValue/KOSDAQ?page=1&pageSize=100' | python3 -c "import sys,json;d=json.load(sys.stdin);print({k:(v if not isinstance(v,list) else len(v)) for k,v in d.items()})"
      - name: OpenDART corp codes and all-company list (key not printed)
        env:
          KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          curl -s -o /tmp/corp.zip -w 'corpCode HTTP %{http_code} size %{size_download}\n' "https://opendart.fss.or.kr/api/corpCode.xml?crtfc_key=$KEY"
          unzip -o -q /tmp/corp.zip -d /tmp/corp && ls -la /tmp/corp && grep -c '<stock_code>[0-9]' /tmp/corp/*.xml && grep -B2 -A3 '<stock_code>005930' /tmp/corp/*.xml | head -12
          curl -s "https://opendart.fss.or.kr/api/list.json?crtfc_key=$KEY&bgn_de=20261002&end_de=20261002&page_count=100&corp_cls=Y" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('status'),d.get('total_count'),d.get('total_page'));[print(x['corp_name'],x['stock_code'],x['report_nm']) for x in d.get('list',[])[:15]]"

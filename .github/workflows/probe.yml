name: Probe Naver theme pages
# Read-only: fetches public Naver Finance theme pages and prints their shape (sizes, link patterns, a short snippet).
on:
  workflow_dispatch:
  push:
    branches: [claude/busy-ramanujan-yrcmb7]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Theme list and one theme
        run: |
          cat > probe.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0 (compatible; GnomonAnalytics/1.0; +https://hanul442.github.io/gnomon_analytics/)' };
          for (const url of ['https://finance.naver.com/sise/theme.naver?&page=1', 'https://finance.naver.com/sise/theme.naver?page=1', 'https://finance.naver.com/sise/sise_group_detail.naver?type=theme&no=536']) {
            const r = await fetch(url, { headers: UA });
            const buf = await r.arrayBuffer();
            const html = new TextDecoder('euc-kr').decode(buf);
            const i = html.indexOf('sise_group_detail');
            console.log('URL', url, 'status', r.status, 'final', r.url, 'bytes', buf.byteLength, 'type', r.headers.get('content-type'));
            console.log('  links sise_group_detail:', (html.match(/sise_group_detail/g) || []).length, ' item/main:', (html.match(/item\/main\.naver\?code=/g) || []).length, ' info_txt:', (html.match(/info_txt/g) || []).length);
            console.log('  title:', (/<title>([^<]*)/.exec(html) || [])[1]);
            console.log('  snippet:', JSON.stringify(html.slice(Math.max(0, i - 120), i + 220)));
          }
          JS
          node probe.mjs

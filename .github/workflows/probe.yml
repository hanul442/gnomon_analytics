name: Probe Naver theme pages
# Read-only: fetches public Naver Finance theme pages and prints their shape (sizes, link patterns, a short snippet).
on:
  workflow_dispatch:
  push:
    branches: [claude/busy-ramanujan-yrcmb7]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Theme list and one theme
        run: |
          cat > probe.mjs <<'JS'
          const H = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36', Accept: 'application/json' };
          const list = await fetch('https://m.stock.naver.com/api/stocks/theme?page=1&pageSize=100', { headers: H }).then((r) => r.json());
          console.log('list keys', Object.keys(list), 'groups', list.groups?.length, 'total', list.totalCount, 'first', JSON.stringify(list.groups?.[0]));
          const last = await fetch('https://m.stock.naver.com/api/stocks/theme?page=4&pageSize=100', { headers: H }).then((r) => r.json());
          console.log('page4 groups', last.groups?.length);
          const one = await fetch('https://m.stock.naver.com/api/stocks/theme/536?page=1&pageSize=100', { headers: H }).then((r) => r.json());
          console.log('detail keys', Object.keys(one), 'stocks', one.stocks?.length, 'total', one.totalCount);
          console.log('first stock', JSON.stringify(one.stocks?.[0]));
          for (const k of Object.keys(one)) if (k !== 'stocks') console.log('  ', k, JSON.stringify(one[k]).slice(0, 300));
          JS
          node probe.mjs

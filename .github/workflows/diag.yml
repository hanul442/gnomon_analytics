name: Diagnose API
# Read-only look at recent on-demand report jobs (symbol, kind, status, stage, error, times).
# No user ids, emails or inputs are printed: this repository's logs are public.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save wrangler@4
      - name: Recent report jobs
        run: |
          id=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write((l.find(x=>x.name==='gnm')||{}).uuid||'')")
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 execute gnm --remote --json --command "SELECT symbol, kind, status, stage, substr(error,1,200) AS error, substr(error_detail,1,300) AS detail, round(usd,4) AS usd, created_at, updated_at FROM report_jobs ORDER BY created_at DESC LIMIT 20" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const row of r[0].results)console.log(JSON.stringify(row))"
          npx wrangler d1 execute gnm --remote --json --command "SELECT status, COUNT(*) AS n FROM report_jobs GROUP BY status" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(r[0].results))"
          echo "--- plans by role (counts only)"
          npx wrangler d1 execute gnm --remote --json --command "SELECT role, plan, disabled, COUNT(*) AS n FROM users GROUP BY role, plan, disabled" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const row of r[0].results)console.log(JSON.stringify(row))"
          echo "--- push subscriptions and price alerts (counts only)"
          npx wrangler d1 execute gnm --remote --json --command "SELECT (SELECT COUNT(*) FROM push_subs) AS subs, (SELECT COUNT(*) FROM price_alerts) AS alerts, (SELECT COUNT(*) FROM notifications WHERE created_at >= datetime('now','-1 day')) AS notes_24h" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(r[0].results))"
      - name: Naver realtime quote shape (public data, no secrets)
        run: |
          for s in 005930 069500; do
            curl -s -m 10 -A "Mozilla/5.0" "https://polling.finance.naver.com/api/realtime/domestic/stock/$s" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(d,null,1).slice(0,3500))"
          done
          date -u
      - name: Detail data sources shape (public data, no secrets)
        run: |
          probe() { echo "=== $1"; code=$(curl -s -m 15 -A "Mozilla/5.0" -o /tmp/p.txt -w "%{http_code}" "${@:2}"); echo "HTTP $code"; head -c 1500 /tmp/p.txt; echo; }
          probe binance-premium "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
          probe binance-oihist "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1d&limit=3"
          probe okx-funding "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          probe okx-oi "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP"
          probe okx-oi-hist "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1D"
          probe okx-liq "https://www.okx.com/api/v5/public/liquidation-orders?instType=SWAP&uly=BTC-USDT&state=filled&limit=2"
          probe okx-lsr "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1D"
          probe bybit "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe krx-short -X POST "https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd" -H "Referer: https://data.krx.co.kr/contents/MDC/MDI/mdiLoader/index.cmd" -d "bld=dbms/MDC/STAT/srt/MDCSTAT30102&isuCd=KR7005930003&strtDd=20260901&endDd=20261007"
          probe daum-quote "https://finance.daum.net/api/quotes/A005930?summary=false&changeStatistics=true" -H "Referer: https://finance.daum.net/quotes/A005930"
          probe naver-world-basic "https://api.stock.naver.com/stock/AAPL.O/basic"
          probe naver-world-integration "https://api.stock.naver.com/stock/AAPL.O/integration"
          probe naver-world-chart "https://api.stock.naver.com/chart/foreign/item/AAPL.O/day?startDateTime=202609010000&endDateTime=202610080000"
          probe naver-world-poll "https://polling.finance.naver.com/api/realtime/worldstock/stock/AAPL.O"
          probe naver-world-finance "https://api.stock.naver.com/stock/AAPL.O/finance/annual"
          probe yahoo-chart "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d"
          echo "=== daum-quote keys"; curl -s -m 15 -A "Mozilla/5.0" -H "Referer: https://finance.daum.net/quotes/A005930" "https://finance.daum.net/api/quotes/A005930?summary=false&changeStatistics=true" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(Object.keys(d).join(','))"
          probe daum-investor "https://finance.daum.net/api/investor/days?symbolCode=A005930&page=1&perPage=3" -H "Referer: https://finance.daum.net/quotes/A005930"
          probe daum-credit "https://finance.daum.net/api/quote/A005930/credit?page=1&perPage=3" -H "Referer: https://finance.daum.net/quotes/A005930"
          probe daum-short "https://finance.daum.net/api/quote/A005930/short_selling?page=1&perPage=3" -H "Referer: https://finance.daum.net/quotes/A005930"
          probe naver-short "https://m.stock.naver.com/api/stock/005930/shortSelling"
          probe naver-credit "https://m.stock.naver.com/api/stock/005930/creditTrend"
          probe krx-open-short "https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd?bld=dbms/MDC/STAT/srt/MDCSTAT30001&mktId=STK&trdDd=20261007"
          date -u

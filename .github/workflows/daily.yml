name: Daily report
on:
  push:
    branches: [main]
    paths: ['assets/**', 'src/report/**', 'src/cli/**', 'vendor/thinking-orbs/**', '.github/workflows/daily.yml']
  schedule:
    # 18:30 KST on weekdays (09:30 UTC). GitHub may start scheduled runs late.
    - cron: '30 9 * * 1-5'
    # Weekends: the coin's daily AI report and the coin list (G-56); stock pages are rebuilt as they are.
    - cron: '30 9 * * 0,6'
  workflow_dispatch:
    inputs:
      regen_market:
        description: "Regenerate today's market daily AI committee (keeps the old one if it fails)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      # A queued run must start from the data the previous run pushed, not from
      # the commit it was triggered on, or its push is rejected.
      - name: Start from the latest data
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Collect and build today's report
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNM_DEEP_KEY: ${{ secrets.GNM_DEEP_KEY }}
          MARKET_REGEN: ${{ inputs.regen_market && '1' || '' }}
        run: npm run daily
      - name: Commit collected data and reports
        run: |
          git config user.name "gnomon-bot"
          git config user.email "gnomon-bot@users.noreply.github.com"
          # data/ and reports/ are the only tracked outputs; site/ and dist/ are ignored.
          git add -A
          git diff --cached --quiet || git commit -m "data: daily run $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved during the run (a merge, another run): replay this run's data on top.
          # (During a rebase "theirs" is this run's commit, so its data wins a conflict.)
          ok=0; for i in 1 2 3; do if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi; sleep 5; done
          [ "$ok" = 1 ]
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # One open "run-alert" issue while runs need a person; closed by the next healthy run (docs/DESIGN.md G-32).
      - name: Summarize the run for alerts
        id: alert
        if: always()
        run: |
          if [ -f data/status/last-run.json ] && [ -f dist/cli/alert.js ]; then
            node dist/cli/alert.js data/status/last-run.json "$RUNNER_TEMP/alert.md" >> "$GITHUB_OUTPUT"
          else
            printf 'run did not reach the status file\n' > "$RUNNER_TEMP/alert.md"; echo "alert=true" >> "$GITHUB_OUTPUT"; echo "title=실행 경보: 실행이 중간에 멈췄어요" >> "$GITHUB_OUTPUT"
          fi
      - name: Open, update or close the alert issue
        if: always()
        uses: actions/github-script@v7
        env:
          ALERT: ${{ steps.alert.outputs.alert }}
          TITLE: ${{ steps.alert.outputs.title }}
          JOB_FAILED: ${{ job.status != 'success' }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = fs.existsSync(`${process.env.RUNNER_TEMP}/alert.md`) ? fs.readFileSync(`${process.env.RUNNER_TEMP}/alert.md`, 'utf8') : '';
            const failed = process.env.JOB_FAILED === 'true';
            const alert = process.env.ALERT === 'true' || failed;
            const title = failed && process.env.ALERT !== 'true' ? '실행 경보: 워크플로가 실패했어요' : (process.env.TITLE || '실행 경보');
            body = `${failed ? '**워크플로 단계가 실패했어요.** ' : ''}[실행 기록](${runUrl})\n\n${body}`;
            const label = 'run-alert';
            await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd1373d', description: '매일 실행 경보' }).catch(() => {});
            const open = (await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open', per_page: 5 })).data;
            if (alert) {
              if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: `### ${title}\n\n${body}` });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            } else {
              for (const i of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `다음 실행이 정상이라 닫아요. [실행 기록](${runUrl})` });
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
            }

# Alpha API (docs/DESIGN.md §5.13). Deployed by .github/workflows/api.yml, which fills in the D1 id.
name = "gnm-api"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SITE_URL = "https://hanul442.github.io/gnomon_analytics"
ALLOW_ORIGINS = "http://localhost:8765"
MAIL_FROM = "Gnomon <onboarding@resend.dev>"
# All users together, USD a day (KST); a user's questions a day.
AI_DAILY_USD = "5"
USER_DAILY_ASKS = "30"

[[d1_databases]]
binding = "DB"
database_name = "gnm"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Alpha API (docs/DESIGN.md §5.13). Deployed by .github/workflows/api.yml, which fills in the D1 id.
name = "gnm-api"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Screener alerts after the daily build (18:30 KST run): 20:10 and 22:10 KST on weekdays; once per data date.
# Intraday scan every 10 minutes, 09:00–15:59 KST on weekdays (the job itself keeps to 09:10–15:45).
[triggers]
crons = ["10 10,11,13 * * *", "*/10 * * * *"]

[vars]
SITE_URL = "https://hanul442.github.io/gnomon_analytics"
ALLOW_ORIGINS = "https://gnm-analytics.kro.kr,https://www.gnm-analytics.kro.kr,http://localhost:8765"
MAIL_FROM = "CURIA <onboarding@resend.dev>"
# All users together, USD a day (KST); a user's questions a day.
AI_DAILY_USD = "5"
USER_DAILY_ASKS = "30"

[[d1_databases]]
binding = "DB"
database_name = "gnm"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Durable on-demand report jobs (provisioned by Deploy API).
[[queues.producers]]
binding = "REPORT_QUEUE"
queue = "gnm-reports"
[[queues.consumers]]
queue = "gnm-reports"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 2
